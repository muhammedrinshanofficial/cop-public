name: deploy-infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    env:
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      ADMIN_PRINCIPAL_ID: ${{ secrets.ADMIN_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: az deployment sub what-if --location swedencentral --parameters infra/main.dev.bicepparam
      - name: Deploy
        run: az deployment sub create --name cop-main-dev --location swedencentral --parameters infra/main.dev.bicepparam